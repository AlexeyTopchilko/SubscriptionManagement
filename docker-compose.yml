services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: submanager-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: submanager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
